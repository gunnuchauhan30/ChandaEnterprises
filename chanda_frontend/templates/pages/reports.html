{% extends "base.html" %}
{% block title %}Reports - Chanda Enterprises{% endblock %}
{% block page_title %}Reports{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 1400px; margin: 0 auto;">
    <div class="glass card-3d" style="padding: 20px 24px; border-radius: 12px; margin-bottom: 20px;">
        <div style="display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;">
            <div class="form-group" style="margin:0;">
                <label for="reportType">Report</label>
                <select id="reportType" onchange="runReport()">
                    <option value="purchase">Purchases</option>
                    <option value="issue">Issues</option>
                    <option value="supplier">Suppliers</option>
                    <option value="consumption">Consumption</option>
                    <option value="department">Department-wise</option>
                    <option value="stock">Current Stock</option>
                </select>
            </div>
            <div class="form-group" style="margin:0;"><label for="dateFrom">From</label><input type="date" id="dateFrom"></div>
            <div class="form-group" style="margin:0;"><label for="dateTo">To</label><input type="date" id="dateTo"></div>
            <button class="btn btn-primary" onclick="runReport()"><i class="bi bi-play-fill"></i> Run</button>
            <button class="btn btn-secondary" onclick="exportReport('excel')"><i class="bi bi-file-earmark-excel"></i> Excel</button>
            <button class="btn btn-secondary" onclick="exportReport('csv')"><i class="bi bi-file-earmark-text"></i> CSV</button>
        </div>
    </div>

    <div class="glass card-3d" style="padding: 24px; border-radius: 12px;">
        <div class="table-container">
            <table>
                <thead><tr id="reportHead"></tr></thead>
                <tbody id="reportBody"><tr><td style="text-align:center; padding:30px; color:#999;">Choose a report and click Run</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => runReport());

    async function runReport() {
        const type = document.getElementById('reportType').value;
        const from = document.getElementById('dateFrom').value || null;
        const to = document.getElementById('dateTo').value || null;
        const response = await API.getReport(type, from, to);
        const head = document.getElementById('reportHead');
        const body = document.getElementById('reportBody');
        head.innerHTML = ''; body.innerHTML = '';

        const rows = (response && response.items) ? response.items : [];
        if (!rows.length) {
            body.innerHTML = '<tr><td style="text-align:center; color:#999; padding:20px;">No data for this range</td></tr>';
            return;
        }
        const cols = Object.keys(rows[0]);
        head.innerHTML = cols.map(c => `<th>${c.replace(/_/g, ' ')}</th>`).join('');
        rows.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = cols.map(c => `<td>${row[c] ?? '-'}</td>`).join('');
            body.appendChild(tr);
        });
    }

    async function exportReport(format) {
        const type = document.getElementById('reportType').value;
        const from = document.getElementById('dateFrom').value || null;
        const to = document.getElementById('dateTo').value || null;
        try {
            const blob = format === 'excel'
                ? await API.exportReportExcel(type, from, to)
                : await API.exportReportCsv(type, from, to);
            downloadFile(blob, `${type}_report.${format === 'excel' ? 'xlsx' : 'csv'}`);
            showAlert('Export downloaded', 'success');
        } catch (e) {
            showAlert('Export failed', 'danger');
        }
    }
</script>
{% endblock %}

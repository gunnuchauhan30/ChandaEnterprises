<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chanda Enterprises</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffffff 0%, #fdf7f5 50%, #fbeee9 100%);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(215, 38, 61, 0.2);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(120, 30, 20, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #e8590c 0%, #d7263d 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: white;
            box-shadow: 0 12px 30px rgba(215, 38, 61, 0.4);
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: #d7263d;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #999;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #262322;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(215, 38, 61, 0.2);
            border-radius: 8px;
            color: #262322;
            font-family: inherit;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #d7263d;
            background: rgba(215, 38, 61, 0.05);
            box-shadow: 0 0 12px rgba(215, 38, 61, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e8590c 0%, #d7263d 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(215, 38, 61, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #999;
        }

        .login-footer a {
            color: #d7263d;
            text-decoration: none;
            transition: color 0.3s;
        }

        .login-footer a:hover {
            color: #e0b3ff;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: #ef4444;
            color: #fca5a5;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(215, 38, 61, 0.2);
            border-top-color: #d7263d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">CE</div>
                <div class="login-title">Chanda Enterprises</div>
                <div class="login-subtitle">Store Management System</div>
            </div>

            <div id="alertMessage" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-login">
                    <span id="btnText">Sign In</span>
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div style="color: #d7263d; margin-top: 12px; font-size: 14px;">Signing in...</div>
            </div>

            <div class="login-footer">
                <div style="margin-bottom: 12px;">
                    <a href="/forgot-password">Forgot password?</a>
                </div>
                <div>
                    New employee accounts are created by your Admin from Settings.
                </div>
            </div>
        </div>
    </div>

    <script>
        window.RAILWAY_BACKEND_URL = "{{ BACKEND_URL }}/api/v1";
    </script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const alertMessage = document.getElementById('alertMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('btnText').style.display = 'none';
            alertMessage.classList.remove('show');

            try {
                const data = await API.login(username, password);
                if (data) {
                    // Store user info
                    localStorage.setItem('user', JSON.stringify(data.user));
                    // Redirect to dashboard
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                alertMessage.classList.add('alert-danger', 'show');
                alertMessage.textContent = error.message;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('btnText').style.display = 'inline';
            }
        });

        // Demo credentials hint
        console.log('%c Demo Credentials Available', 'color: #d7263d; font-size: 16px; font-weight: bold;');
        console.log('Username: admin | Password: (set via seed_admin.py)');
    </script>
</body>
</html>

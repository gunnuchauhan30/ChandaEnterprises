<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Chanda Enterprises</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffffff 0%, #fdf7f5 50%, #fbeee9 100%);
        }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(215, 38, 61, 0.2);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(120, 30, 20, 0.15);
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-title { font-size: 24px; font-weight: 700; color: #d7263d; margin-bottom: 8px; }
        .login-subtitle { font-size: 14px; color: #999; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #262322; font-weight: 500; font-size: 14px; }
        input[type="password"] {
            width: 100%; padding: 12px 14px; background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(215, 38, 61, 0.2); border-radius: 8px;
            color: #262322; font-family: inherit; transition: all 0.3s;
        }
        input[type="password"]:focus {
            outline: none; border-color: #d7263d; background: rgba(215, 38, 61, 0.05);
            box-shadow: 0 0 12px rgba(215, 38, 61, 0.2);
        }
        .btn-login {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #e8590c 0%, #d7263d 100%);
            color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 16px;
            cursor: pointer; transition: all 0.3s; margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(215, 38, 61, 0.4); }
        .login-footer { text-align: center; margin-top: 24px; font-size: 14px; color: #999; }
        .login-footer a { color: #d7263d; text-decoration: none; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid; display: none; }
        .alert.show { display: block; }
        .alert-danger { background: rgba(239, 68, 68, 0.1); border-left-color: #ef4444; color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.1); border-left-color: #10b981; color: #6ee7b7; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-title">Reset Password</div>
                <div class="login-subtitle">Choose a new password for your account</div>
            </div>

            <div id="alertMessage" class="alert"></div>

            {% if not token %}
                <div class="alert alert-danger show">This reset link is missing its token. Please use the link from your email, or request a new one.</div>
                <div class="login-footer"><a href="/forgot-password">Request a new reset link</a></div>
            {% else %}
            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required minlength="8" autofocus>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" required minlength="8">
                </div>
                <button type="submit" class="btn-login">Reset Password</button>
            </form>
            <div class="login-footer">
                <a href="/login">Back to login</a>
            </div>
            {% endif %}
        </div>
    </div>

    <script>
        window.RAILWAY_BACKEND_URL = "{{ BACKEND_URL }}/api/v1";
    </script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        const token = {{ token|tojson }};
        const form = document.getElementById('resetForm');
        const alertMessage = document.getElementById('alertMessage');

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword !== confirmPassword) {
                    alertMessage.className = 'alert alert-danger show';
                    alertMessage.textContent = 'Passwords do not match.';
                    return;
                }

                const result = await API.resetPassword(token, newPassword);
                if (result) {
                    alertMessage.className = 'alert alert-success show';
                    alertMessage.textContent = 'Password reset successfully. Redirecting to login...';
                    setTimeout(() => window.location.href = '/login', 1500);
                }
            });
        }
    </script>
</body>
</html>

{% extends "base.html" %}
{% block title %}New GRN - Chanda Enterprises{% endblock %}
{% block page_title %}New Purchase / GRN{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 700px; margin: 0 auto;">
    <div class="glass card-3d" style="padding: 30px; border-radius: 12px;">
        <form id="purchaseForm">
            <div class="form-group">
                <label for="material_code">Material *</label>
                <select id="material_code" required><option value="">-- Select material --</option></select>
            </div>
            <div class="form-group">
                <label for="supplier_id">Supplier</label>
                <select id="supplier_id"><option value="">-- None --</option></select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label for="qty">Quantity Received *</label>
                    <input type="number" id="qty" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="unit_cost">Unit Cost (₹)</label>
                    <input type="number" id="unit_cost" step="0.01" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="invoice_no">Invoice No</label>
                    <input type="text" id="invoice_no">
                </div>
                <div class="form-group">
                    <label for="invoice_date">Invoice Date</label>
                    <input type="date" id="invoice_date">
                </div>
                <div class="form-group">
                    <label for="batch_no">Lot No. (auto-generated, series)</label>
                    <input type="text" id="batch_no" placeholder="Assigned automatically on save" disabled style="opacity:0.6;">
                </div>
                <div class="form-group">
                    <label for="p_warehouse">Warehouse (put-away location)</label>
                    <input type="text" id="p_warehouse" placeholder="e.g. store">
                </div>
                <div class="form-group">
                    <label for="p_rack">Rack</label>
                    <input type="text" id="p_rack">
                </div>
                <div class="form-group">
                    <label for="p_bin">Bin</label>
                    <input type="text" id="p_bin">
                </div>
            </div>
            <p style="color: var(--text-lighter); font-size: 13px; margin: -8px 0 16px;">
                <i class="bi bi-info-circle"></i> Stock is only increased after QC is marked "passed" on the Purchases list.
            </p>
            <div style="display: flex; gap: 12px;">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create GRN</button>
                <a href="/purchases" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const materials = await API.getMaterials(1, 500);
        const matSel = document.getElementById('material_code');
        if (materials && materials.items) {
            materials.items.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.material_code;
                opt.textContent = `${m.material_code} - ${m.material_name}`;
                matSel.appendChild(opt);
            });
        }

        const suppliers = await API.getSuppliers(1, 200);
        const supSel = document.getElementById('supplier_id');
        if (suppliers && suppliers.items) {
            suppliers.items.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.supplier_name;
                supSel.appendChild(opt);
            });
        }
    });

    document.getElementById('purchaseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            material_code: document.getElementById('material_code').value,
            supplier_id: document.getElementById('supplier_id').value || null,
            qty: parseFloat(document.getElementById('qty').value),
            unit_cost: parseFloat(document.getElementById('unit_cost').value) || 0,
            invoice_no: document.getElementById('invoice_no').value || null,
            invoice_date: document.getElementById('invoice_date').value || null,
            batch_no: document.getElementById('batch_no').value || null,
            warehouse: document.getElementById('p_warehouse').value || null,
            rack: document.getElementById('p_rack').value || null,
            bin: document.getElementById('p_bin').value || null,
        };
        const result = await API.createPurchase(payload);
        if (result) {
            showAlert(`GRN ${result.grn_no} created — Lot No. ${result.batch_no}`, 'success');
            setTimeout(() => window.location.href = '/purchases', 800);
        }
    });
</script>
{% endblock %}

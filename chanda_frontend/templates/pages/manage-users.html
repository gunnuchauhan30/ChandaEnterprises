{% extends "base.html" %}
{% block title %}Manage Users - Chanda Enterprises{% endblock %}
{% block page_title %}Employee Accounts{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 1100px; margin: 0 auto;">

    <!-- Point 6: this replaces the old public /signup page. Only an admin who is
         logged in can reach this screen, and the admin must pick the role --
         nobody can grant themselves access anymore. -->
    <div class="glass card-3d" style="padding: 24px; border-radius: 12px; margin-bottom: 24px;">
        <h3 style="margin-top:0; color: var(--accent-purple); font-size:16px;">Create New Employee Account</h3>
        <form id="newUserForm">
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
                <div class="form-group">
                    <label for="full_name">Full Name *</label>
                    <input type="text" id="full_name" required>
                </div>
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Temporary Password *</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="role">Role *</label>
                    <select id="role" required>
                        <option value="production">Production</option>
                        <option value="store_manager">Store Manager</option>
                        <option value="purchase">Purchase</option>
                        <option value="management">Management</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:8px;">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </form>
    </div>

    <div class="glass card-3d" style="padding: 24px; border-radius: 12px;">
        <h3 style="margin-top:0; color: var(--accent-purple); font-size:16px;">Existing Accounts</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Full Name</th><th>Username</th><th>Email</th><th>Role</th><th>Department</th><th>Status</th><th>Last Login</th><th>Actions</th></tr>
                </thead>
                <tbody id="usersBody">
                    <tr><td colspan="8" style="text-align:center; padding:20px; color:#999;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadUsers);

    document.getElementById('newUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            full_name: document.getElementById('full_name').value,
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value,
            department: document.getElementById('department').value || null,
        };
        const result = await API.signup(payload.username, payload.email, payload.password, payload.full_name, payload.role);
        if (result) {
            showAlert(`Account '${result.username}' created with role '${result.role}'`, 'success');
            document.getElementById('newUserForm').reset();
            loadUsers();
        }
    });

    async function loadUsers() {
        const users = await API.getUsers();
        const tbody = document.getElementById('usersBody');
        tbody.innerHTML = '';
        const items = Array.isArray(users) ? users : (users && users.items) || [];
        if (!items.length) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#999;">No accounts yet</td></tr>';
            return;
        }
        items.forEach(u => {
            const tr = tbody.insertRow();
            tr.innerHTML = `
                <td>${u.full_name || '-'}</td>
                <td>${u.username}</td>
                <td>${u.email}</td>
                <td>
                    <select onchange="changeRole(${u.id}, this.value, '${u.username}')" title="Change role -- e.g. Store Manager gets full Material Master edit access (min/max, edit)" style="padding:4px 8px; border-radius:6px; border:1px solid var(--border-color, #ddd); background:transparent; font-size:12px;">
                        <option value="production" ${u.role === 'production' ? 'selected' : ''}>Production</option>
                        <option value="store_manager" ${u.role === 'store_manager' ? 'selected' : ''}>Store Manager</option>
                        <option value="purchase" ${u.role === 'purchase' ? 'selected' : ''}>Purchase</option>
                        <option value="management" ${u.role === 'management' ? 'selected' : ''}>Management</option>
                        <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                    </select>
                </td>
                <td>${u.department || '-'}</td>
                <td><span class="badge badge-${u.is_active ? 'success' : 'danger'}">${u.is_active ? 'Active' : 'Disabled'}</span></td>
                <td>${u.last_login ? formatDateTime(u.last_login) : 'Never'}</td>
                <td>
                    <button class="btn btn-sm btn-secondary" onclick="toggleActive(${u.id}, ${!u.is_active})">
                        ${u.is_active ? 'Disable' : 'Enable'}
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id}, '${u.username}')">
                        Delete
                    </button>
                </td>
            `;
        });
    }

    async function toggleActive(userId, newActive) {
        const result = await API.updateUser(userId, { is_active: newActive });
        if (result) {
            showAlert('Updated', 'success');
            loadUsers();
        }
    }

    async function changeRole(userId, newRole, username) {
        // Update 1: Store Manager role already has full Material Master
        // access (create, edit, min/max, delete) at the API level -- this
        // is how an account like 'store' gets that access, by being on the
        // right role, instead of needing a code change per account.
        const result = await API.updateUser(userId, { role: newRole });
        if (result) {
            showAlert(`'${username}' is now ${newRole.replace('_', ' ')}`, 'success');
            loadUsers();
        }
    }

    async function deleteUser(userId, username) {
        if (!confirm(`Permanently delete '${username}'? This cannot be undone.`)) return;
        const result = await API.deleteUser(userId);
        if (result === true) {
            showAlert(`'${username}' deleted`, 'success');
            loadUsers();
        } else if (result === 'has_history') {
            if (!confirm(
                `'${username}' has existing purchases/issues/requests/approvals tied to it, so a plain ` +
                `delete would either fail or lose that history.\n\n` +
                `Force delete instead? This reassigns that history to a 'deleted_user' placeholder ` +
                `account (so old records stay intact and attributable) and then permanently removes ` +
                `'${username}'. This cannot be undone.`
            )) return;
            const forced = await API.deleteUser(userId, true);
            if (forced === true) {
                showAlert(`'${username}' force-deleted (history reassigned to 'deleted_user')`, 'success');
                loadUsers();
            }
        }
    }
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Suppliers - Chanda Enterprises{% endblock %}
{% block page_title %}Supplier Master{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 1400px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="searchInput" placeholder="Search suppliers..." style="padding: 10px 14px; background: var(--glass-dark); border: 1px solid var(--glass-medium); border-radius: 8px; color: var(--text-light); width: 250px;">
            <button onclick="searchSuppliers()" class="btn btn-secondary"><i class="bi bi-search"></i> Search</button>
        </div>
        <a href="/suppliers/new" class="btn btn-primary"><i class="bi bi-plus"></i> New Supplier</a>
    </div>

    <div class="glass card-3d" style="padding: 24px; border-radius: 12px;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Supplier Name</th><th>GST No</th><th>Phone</th><th>Email</th>
                        <th>Rating</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="suppliersBody">
                    <tr><td colspan="7" style="text-align: center; padding: 30px; color: #999;">
                        <div class="spinner"></div><div style="margin-top: 10px;">Loading suppliers...</div>
                    </td></tr>
                </tbody>
            </table>
        </div>
        <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px;">
            <button onclick="previousPage()" class="btn btn-secondary btn-sm">← Previous</button>
            <span id="pageInfo" style="color: var(--text-lighter);">Page 1</span>
            <button onclick="nextPage()" id="nextBtn" class="btn btn-secondary btn-sm">Next →</button>
        </div>
    </div>
</div>

<script>
    let currentPage = 1;
    const pageSize = 20;

    document.addEventListener('DOMContentLoaded', () => loadSuppliers());

    async function loadSuppliers(search = '') {
        const response = await API.getSuppliers(currentPage, pageSize, search);
        const tbody = document.getElementById('suppliersBody');
        tbody.innerHTML = '';
        if (!response) return;

        if (response.items && response.items.length > 0) {
            response.items.forEach(s => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${escapeHtml(s.supplier_name)}</td>
                    <td>${s.gst_no || '-'}</td>
                    <td>${s.phone || '-'}</td>
                    <td>${s.email || '-'}</td>
                    <td>${s.rating ?? '-'}</td>
                    <td><span class="badge badge-${s.is_active ? 'success' : 'danger'}">${s.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td>
                        ${s.is_active ? `<button class="btn btn-sm btn-danger" onclick="deactivateSupplier(${s.id})" title="Deactivate"><i class="bi bi-x-lg"></i></button>` : ''}
                    </td>
                `;
            });
            document.getElementById('pageInfo').textContent = `Page ${currentPage}`;
            document.getElementById('nextBtn').disabled = response.items.length < pageSize;
        } else {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #999;">No suppliers found</td></tr>';
        }
    }

    function searchSuppliers() {
        currentPage = 1;
        loadSuppliers(document.getElementById('searchInput').value);
    }

    function nextPage() { currentPage++; loadSuppliers(document.getElementById('searchInput').value); }
    function previousPage() { if (currentPage > 1) currentPage--; loadSuppliers(document.getElementById('searchInput').value); }

    async function deactivateSupplier(id) {
        if (!confirm('Deactivate this supplier? This cannot be undone from here.')) return;
        const result = await API.deactivateSupplier(id);
        if (result !== null) {
            showAlert('Supplier deactivated', 'success');
            loadSuppliers();
        }
    }
</script>
{% endblock %}
